name: Daily menu

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Slack에 전송하지 않고 결과만 출력"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: daily-nanet-menu
  cancel-in-progress: false

jobs:
  post-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Manual dry-run
        if: inputs.dry_run
        run: python -m nanet_menu --dry-run
      - name: Manual Slack post
        if: ${{ !inputs.dry_run }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
        run: python -m nanet_menu
