name: Daily menu

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Slack에 전송하지 않고 결과만 출력"
        required: true
        type: boolean
        default: true
      target_date:
        description: "처리할 날짜(YYYY-MM-DD, 비우면 오늘)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-nanet-menu
  cancel-in-progress: false

jobs:
  post-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Manual dry-run
        if: inputs.dry_run
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python -m nanet_menu --date "$TARGET_DATE" --dry-run
          else
            python -m nanet_menu --dry-run
          fi
      - name: Manual Slack post
        if: ${{ !inputs.dry_run }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python -m nanet_menu --date "$TARGET_DATE"
          else
            python -m nanet_menu
          fi
