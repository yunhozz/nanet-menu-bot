[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanet-menu"
version = "0.1.0"
description = "Post the National Assembly Library daily menu to Slack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "pdfplumber>=0.11,<1",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "responses>=0.25,<1",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nanet_menu"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not integration'"
markers = [
  "integration: calls the live National Assembly Library website",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
