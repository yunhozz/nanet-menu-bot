[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanet-menu"
version = "0.1.0"
description = "Post the National Assembly Library daily menu to Slack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "holidays>=0.63,<1",
  "lxml>=5,<7",
  "pdfplumber>=0.11,<1",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
firebase = [
  "firebase-functions>=0.4,<1",
  "google-cloud-firestore==2.28.0",
  "google-api-core>=2.24.2,<3",
  "google-auth>=2.14.1,<3",
  "grpcio>=1.59,<2",
]
dev = [
  "firebase-functions>=0.4,<1",
  "google-cloud-firestore==2.28.0",
  "google-api-core>=2.24.2,<3",
  "google-auth>=2.14.1,<3",
  "grpcio>=1.59,<2",
  "pytest>=8,<10",
  "responses>=0.25,<1",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nanet_menu"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not integration and not firestore_emulator'"
markers = [
  "integration: calls the live National Assembly Library website",
  "firestore_emulator: isolated loopback Firestore transaction checks",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
